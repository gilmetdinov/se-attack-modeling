services:
  backend:
    build: ./app
    container_name: attack-backend
    restart: unless-stopped
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER=/usr/bin/chromedriver
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-admin}
      - DB_PASS=${DB_PASS:-change-me}
      - DB_NAME=${DB_NAME:-attack_modeling}
      - SECRET_KEY=${SECRET_KEY:-}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}

  db:
    image: postgres:14
    container_name: attack-db
    restart: unless-stopped
    volumes:
      - ./db/data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-attack_modeling}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-change-me}
    ports:
      - "5432:5432"
  
  frontend:
    build: ./frontend  # папка где лежит package.json и src
    container_name: attack-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  default:
    name: attack-net
